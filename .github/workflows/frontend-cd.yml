name: Frontend-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"

jobs:
  frontend-cd:
    runs-on: ubuntu-latest

    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET_NAME: kgb-frontend
      CLOUDFRONT_DISTRIBUTION_ID: E3Q7ETZYCFX2WY
      SERVICE_URL: https://kguidebook.site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_API_MOCKING: ${{ secrets.VITE_API_MOCKING }}
          VITE_SERVER: ${{ secrets.VITE_SERVER }}
          VITE_CRYPTO_KEY_NAME: ${{ secrets.VITE_CRYPTO_KEY_NAME }}
          VITE_CRYPTO_KEY_LENGTH: ${{ secrets.VITE_CRYPTO_KEY_LENGTH }}
        run: npm run build

      # 현재 배포 Commit을 확인하기 위한 파일 생성
      - name: Create version.json
        run: |
          echo "{\"commitSha\":\"${GITHUB_SHA}\"}" > dist/version.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_S3_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_S3_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 이전 정적 Asset을 별도로 보존하지 않음
      - name: Upload to S3
        run: |
          aws s3 sync dist/ \
            "s3://${S3_BUCKET_NAME}/" \
            --delete

      # 캐시 무효화
      - name: Invalidate CloudFront Cache
        id: invalidate
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "invalidation_id=${INVALIDATION_ID}" >> "$GITHUB_OUTPUT"

      # 캐시 무효화 완료 대기
      - name: Wait for CloudFront Invalidation
        run: |
          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${{ steps.invalidate.outputs.invalidation_id }}"

      # 실제 배포된 Commit 확인
      - name: Verify deployed version
        run: |
          RESPONSE=$(curl -fsS "${SERVICE_URL}/version.json")
          DEPLOYED_SHA=$(echo "$RESPONSE" | jq -r '.commitSha')

          if [ "${DEPLOYED_SHA}" != "${GITHUB_SHA}" ]; then
            echo "배포 실패: 제공 중인 버전이 배포 대상과 일치하지 않음"
            exit 1
          fi

          echo "배포 버전 확인 성공"

      # Service URL이 정상적으로 응답하는지 확인
      - name: 서비스 응답 확인
        run: |
          if curl -fsS "${SERVICE_URL}/" > /dev/null; then
            echo "서비스 응답 확인 성공"
          else
            echo "서비스 응답 확인 실패"
            exit 1
          fi
