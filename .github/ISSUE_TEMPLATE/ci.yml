name: CI
description: 검사·빌드·배포 파이프라인 변경을 등록합니다.
title: "[ci][infra] "
labels: [ci]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 현재 파이프라인 문제와 변경 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: triggers
    attributes: {label: 트리거와 실행 조건, description: 대상 브랜치, 이벤트, 권한과 필요한 secret을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: job·step·cache·artifact와 비범위를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: rollback
    attributes: {label: 위험과 복구, description: 배포 영향과 롤백·복구 방법을 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 트리거별 기대 결과와 실패 조건을 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: PR 검사, 배포, 권한, secret, 빌드 시간과 문서 영향을 작성해 주세요.}
    validations: {required: true}
