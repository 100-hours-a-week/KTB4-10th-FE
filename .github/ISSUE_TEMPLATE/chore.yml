name: 작업
description: 빌드·설정·의존성·유지보수 작업을 등록합니다.
title: "[chore][domain] "
labels: [chore]
body:
  - type: dropdown
    id: domain
    attributes: {label: 영역, options: [회원, 관광 콘텐츠, 가이드북, 평가, 생성권, 공통, 인프라]}
    validations: {required: true}
  - type: textarea
    id: purpose
    attributes: {label: 작업 목적, description: 유지보수가 필요한 이유를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: scope
    attributes: {label: 작업 범위, description: 설정·도구·의존성과 비범위를 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: risk
    attributes: {label: 위험과 복구, description: 빌드·배포·개발 환경 영향과 복구 방법을 작성해 주세요.}
  - type: textarea
    id: acceptance-criteria
    attributes: {label: 완료 조건, description: 검증 명령과 기대 결과를 작성해 주세요.}
    validations: {required: true}
  - type: input
    id: requirement-ids
    attributes: {label: 관련 요구사항 ID, description: 없으면 '해당 없음'으로 작성해 주세요.}
    validations: {required: true}
  - type: textarea
    id: references
    attributes: {label: 관련 자료}
  - type: textarea
    id: impact
    attributes: {label: 영향 범위, description: 로컬 개발, CI, 빌드 산출물, 배포와 문서 영향을 작성해 주세요.}
    validations: {required: true}
